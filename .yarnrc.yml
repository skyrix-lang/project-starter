# Supply-chain settings (docs/decisions.md, "Yarn supply-chain settings").
# Install scripts are a common worm vector: none run unless allowed per package
# in package.json "dependenciesMeta".
enableScripts: false

nodeLinker: node-modules

# Versions published less than 7 days ago are not installed: most malicious
# releases are found and pulled within that time.
npmMinimalAgeGate: 7d
