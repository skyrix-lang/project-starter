name: Deploy

# Called by the nightly (nightly.yml) once its checks are done, around 02:00
# Paris time:
#   - the nightly passed, and the commit it checked is new on the server:
#     deploy it (`yarn deploy`, scripts/deploy.sh). The server backs up the
#     database first, proves the backup restores and uploads it to R2; only
#     then does it migrate and start the new version, and check the public
#     https address. If anything after the backup fails, it restores the
#     database and starts the previous version (docs/deployment.md,
#     "Deploying" and "Backups").
#   - the nightly failed, or nothing is new: back the database up all the
#     same. A red nightly never skips the backup.
# "Run workflow" in the Actions tab deploys main now, whatever the hour and
# whatever the nightly said.
# Does nothing until the DEPLOY_SSH variable is set.
# Setup: docs/auto-deploy.md, and "Backups" in docs/deployment.md.

on:
  workflow_call:
    inputs:
      # The commit the nightly checked, and whether all its checks passed.
      sha:
        type: string
        required: true
      checks:
        type: string # success or failure
        required: true
  workflow_dispatch:

# One at a time, in order: never cancelled in the middle of a migration.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: vars.DEPLOY_SSH != ''
    # Always GitHub's runner, even with the RUNNER variable: this job writes
    # the deploy key and known_hosts into the runner's home, which every job
    # on your own runner shares.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Settings → Environments → production: where the secrets live, and where
    # you can require an approval or limit deploys to main.
    environment: production
    env:
      DEPLOY_SSH: ${{ vars.DEPLOY_SSH }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || 'apps/booking-platform' }}
      # The address to check after a deploy; empty means the server's PUBLIC_URL.
      DEPLOY_URL: ${{ vars.DEPLOY_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The nightly's commit, even if main moved on while it ran: only
          # what was checked is deployed. By hand, main.
          ref: ${{ inputs.sha || 'main' }}
          # History, to tell whether the server runs something newer.
          fetch-depth: 0

      # A key for this purpose only, and the server's host key pinned: no
      # trust-on-first-use, so a spoofed server gets nothing.
      - name: SSH key and known host
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::Set the DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS secrets in the production environment (docs/auto-deploy.md)."
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts
          echo "DEPLOY_SSH_OPTIONS=-i $HOME/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes" >> "$GITHUB_ENV"

      # Deploy the nightly's commit if it passed and is new on the server;
      # otherwise, only back up. By hand, always deploy.
      - id: what
        name: Deploy or back up?
        env:
          CHECKS: ${{ inputs.checks }}
        run: |
          head=$(git rev-parse HEAD)
          # shellcheck disable=SC2086
          deployed=$(ssh -p "$DEPLOY_PORT" $DEPLOY_SSH_OPTIONS "$DEPLOY_SSH" "cat '$DEPLOY_DIR/deployed' 2>/dev/null" || true)
          if [ -z "$CHECKS" ]; then
            echo "Run by hand: deploying ${head:0:7}."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif [ "$deployed" = "$head" ]; then
            echo "The server already runs ${head:0:7}: backing up only."
          # A commit this history knows that isn't in the nightly's: deployed
          # by hand since the nightly started, for instance. Never put older
          # code on a newer schema. A commit it doesn't know (a force-pushed
          # main, a deploy from a local commit) doesn't block: the nightly's
          # checked commit replaces it.
          elif [ -n "$deployed" ] && git cat-file -e "$deployed^{commit}" 2>/dev/null &&
            ! git merge-base --is-ancestor "$deployed" "$head"; then
            echo "::warning::The server runs ${deployed:0:7}, which ${head:0:7} doesn't include: not deploying an older commit, backing up only."
          elif [ "$CHECKS" != success ]; then
            echo "::warning::The nightly failed on ${head:0:7}: not deploying tonight, backing up only."
          else
            echo "Deploying ${head:0:7} (the server runs ${deployed:0:7})."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: yarn deploy
        if: steps.what.outputs.deploy == 'true'
        # Needs git, ssh, tar and curl, not Node or Yarn.
        run: sh scripts/deploy.sh

      - name: Back up the database
        if: steps.what.outputs.deploy != 'true'
        run: |
          # shellcheck disable=SC2086
          ssh -p "$DEPLOY_PORT" $DEPLOY_SSH_OPTIONS "$DEPLOY_SSH" \
            "cd '$DEPLOY_DIR/src' && sh scripts/backup-remote.sh"

      - name: Clean up the key
        if: always()
        run: rm -f ~/.ssh/id_deploy
