name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Format, types, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # Corepack provides the Yarn version from package.json. It must be on
      # before setup-node, which runs Yarn to locate its cache.
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      # Format check, types, lint and unit tests: what agents run after each step.
      - run: yarn verify

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - run: yarn playwright install --with-deps chromium
      # Starts Postgres and Mailpit in Docker, builds the app and runs the tests,
      # exactly as it does locally.
      - run: yarn test
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
