name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # The nightly (nightly.yml) runs this same CI on main, with `nightly: true`:
  # coverage, Firefox and WebKit, and no retries.
  workflow_call:
    inputs:
      nightly:
        type: boolean
        default: false

# A newer push to the same branch or pull request cancels the run in progress.
# The event is in the name, so the nightly and a push to main don't cancel
# each other.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read # is a nightly issue open? (the last step of checks)

jobs:
  checks:
    name: Format, types, lint, boundaries, API contract and unit tests
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Corepack provides the Yarn version from package.json. It must be on
      # before setup-node, which runs Yarn to locate its cache.
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      # Lockfile only, no install scripts, no version younger than 7 days
      # (.yarnrc.yml).
      - run: yarn install --immutable
      # What agents run after each step.
      - run: yarn verify
      # While the nightly is red (an open issue labelled "nightly"), the pull
      # requests that merge themselves wait: Renovate's and the sync from the
      # starter. Not Renovate's security fixes (label "security", default.json),
      # which may be what turns it green, and never people's pull requests.
      # To merge a held one yourself, close the issue: its CI runs again
      # (nightly-closed.yml).
      - name: Is the nightly green?
        if: >-
          github.event_name == 'pull_request' &&
          (startsWith(github.head_ref, 'renovate/') ||
          github.head_ref == 'sync-from-starter') &&
          !contains(github.event.pull_request.labels.*.name, 'security')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --label nightly --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            echo "::error::The nightly is red (#$issue): this pull request waits until it's fixed. If it is the fix, close #$issue: CI runs again here, then it merges."
            exit 1
          fi

  e2e:
    name: Playwright (with axe)
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    # On your own runners (the RUNNER variable), one e2e job at a time: they
    # share one Docker, where Postgres and Keycloak are containers with fixed
    # names and ports (scripts/db-up.sh, scripts/keycloak-up.sh). GitHub's
    # runners each have their own, so there every run is its own group.
    concurrency:
      group: e2e-${{ vars.RUNNER || github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      # Chromium, and at night Firefox and WebKit too. Their system libraries
      # need sudo: on your own runners they're installed once by an admin
      # (docs/development.md, "CI").
      - id: browsers
        run: echo "list=chromium${{ inputs.nightly && ' firefox webkit' || '' }}" >> "$GITHUB_OUTPUT"
      - if: runner.environment == 'github-hosted'
        run: yarn playwright install --with-deps ${{ steps.browsers.outputs.list }}
      - if: runner.environment != 'github-hosted'
        run: yarn playwright install ${{ steps.browsers.outputs.list }}
      # Starts Postgres and Keycloak in Docker, builds the app and runs the
      # tests, exactly as it does locally.
      # At night, with coverage: the unit and e2e tests' together, checked
      # against coverage-minimums.json (scripts/coverage.ts).
      - run: ${{ inputs.nightly && 'yarn test:coverage' || 'yarn test' }}
        env:
          CI: true
          E2E_RETRIES: ${{ inputs.nightly && '0' || '' }}
          E2E_BROWSERS: ${{ inputs.nightly && 'all' || '' }}
      # Your own runner keeps running what a job started: stop the
      # containers, so they don't hold its memory until the next run. Each
      # command may fail (a container never started, a job that stopped
      # before Yarn was set up): try both, and never fail the job here.
      - if: always() && runner.environment != 'github-hosted'
        run: |
          yarn db:down || true
          yarn keycloak:down || true
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report${{ inputs.nightly && '-nightly' || '' }}
          path: |
            playwright-report/
            coverage/report/
          retention-days: 14

  image:
    name: Image (SBOM, provenance, signature)
    needs: [checks, e2e]
    # Pushes to main and tags only: not pull requests, not the nightly.
    if: github.event_name == 'push'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing with cosign
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
      # An SBOM and build provenance are attached to every image: the Cyber
      # Resilience Act expects an SBOM per release.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: runner
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: sigstore/cosign-installer@v3
        if: startsWith(github.ref, 'refs/tags/')
      - name: Sign the release image
        if: startsWith(github.ref, 'refs/tags/')
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
