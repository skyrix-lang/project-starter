# The production image on your machine, with everything it needs:
#
#   yarn docker:up        then http://localhost:8080, sign in as ada / ada
#
# It shows the deploy order (database, then migrations, then the app) and is a
# way to try the real image before shipping it. For local use only: the
# passwords and the session secret below are public, and Keycloak runs in
# development mode with the test realm. Day-to-day work uses `yarn dev` instead.
name: booking-platform

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-h", "127.0.0.1", "-U", "booking"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Applies the migrations and exits. The app starts only when it succeeded.
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgres://booking:booking@db:5432/booking
    depends_on:
      db:
        condition: service_healthy

  # The browser and the app must reach the identity provider at the same
  # address, since that address is the issuer. `keycloak.localhost` is this
  # machine for a browser and this container for the app, on the same port.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: start-dev --import-realm --http-port=8280
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8280:8280"
    networks:
      default:
        aliases: [keycloak.localhost]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/8280 && printf 'GET /realms/booking HTTP/1.1\\r\\nHost: keycloak.localhost:8280\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3",
        ]
      interval: 3s
      timeout: 3s
      retries: 40

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runner
    environment:
      PUBLIC_URL: http://localhost:${APP_PORT:-8080}
      DATABASE_URL: postgres://booking:booking@db:5432/booking
      SESSION_SECRET: local-compose-only-not-a-secret-0123456789
      OIDC_ISSUER: http://keycloak.localhost:8280/realms/booking
      OIDC_CLIENT_ID: booking-web
      OIDC_CLIENT_SECRET: booking-web-dev-secret
    ports:
      - "${APP_PORT:-8080}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    # Time for in-flight requests to finish after SIGTERM (apps/bff/src/server.ts).
    stop_grace_period: 15s

volumes:
  db:
